name: Deploy portfolio mirror (Cloudflare Workers)

# Deploys the pulpina-portfolio branch (never main) to pulpina.lucia-adams.com, a separate
# Worker ("pulpi-a-worlds-portfolio") using the "portfolio" env in
# wrangler.jsonc. Completely isolated from the "production" env that
# serves pulpinastore.com: different Worker name, no cron trigger, and
# no secrets/bindings of its own (there is nothing to leak — RESEND_API_KEY,
# D1, R2, etc. are only ever configured on the production Worker).
# Every page on this mirror sends X-Robots-Tag: noindex.

on:
  push:
    branches:
      - pulpina-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No explicit version: package.json's "packageManager": "pnpm@11.3.0"
      # already pins one; setting both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # pnpm@11.3.0 (pinned via packageManager) requires Node >=22.13,
          # so this can't be 20. Pinned to the exact minimum (22.13.0)
          # rather than floating "22", since floating resolved to 22.20.0
          # locally and hit ERR_PACKAGE_IMPORT_NOT_DEFINED
          # ("#module-sync-enabled") in vite@7.3.3 — a version-specific
          # bug, not a general Node 22 issue (this project's own tooling
          # already requires Node >=22.13 to run pnpm at all).
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # TanStack Start's #tanstack-start-entry / #tanstack-router-entry /
      # tanstack-start-manifest:v virtual modules only exist after Vite's
      # build runs — `wrangler deploy` alone can't resolve them (Cloudflare's
      # own docs confirm the pattern is "build && wrangler deploy").
      #
      # CLOUDFLARE_ENV must be set here, at build time — @cloudflare/vite-plugin
      # flattens wrangler.jsonc's named environments into a single redirected
      # config (dist/server/wrangler.json) during the build, and `wrangler
      # deploy --env` alone does NOT select which one; without this, the build
      # silently flattens to the top-level default (wrong name, wrong routes,
      # wrong triggers — this is exactly what deployed to "tanstack-start-app"
      # with the production cron attached instead of "pulpi-a-worlds-portfolio").
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: portfolio

      - name: Deploy portfolio Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env portfolio
